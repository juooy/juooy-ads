[versions]
# Kotlin & Gradle
annotation-experimental = "1.6.0"
appcompat = "1.7.1"
constraintlayout = "2.2.1"
core-ktx = "1.18.0"
espresso-core = "3.7.0"
facebook = "6.21.0.2"
firebase-bom = "34.12.0"
fragment-ktx = "1.8.9"
junit-version = "1.2.1"
kotlin = "2.0.21"
agp = "8.5.2"

# AndroidX & Compose
androidx-activity-compose = "1.8.0"
androidx-activity-ktx = "1.8.0"
androidx-compose = "1.6.0"
androidx-compose-compiler = "1.6.8"
androidx-material3 = "1.2.1"
androidx-lifecycle = "2.6.2"

# Testing
junit = "4.13.2"
androidx-test = "1.2.1"
kotest = "5.7.2"
robolectric = "4.13"

# Date/Time
kotlinx-coroutines-android = "1.10.2"
kotlinx-datetime = "0.5.0"

# Coroutines
kotlinx-coroutines = "1.7.3"

# Serialization
kotlinx-serialization = "1.6.2"

# Networking
ktor = "2.3.4"

# Database
lifecycle-extensions = "2.2.0"
lifecycle-livedata-ktx = "2.10.0"
material = "1.13.0"
play-services-ads = "25.2.0"
preference-ktx = "1.2.1"
realm = "1.14.0"

# DI
koin = "3.5.0"
koin-android-compose = "3.5.0"

# Logging
logback = "1.4.11"
recyclerview = "1.4.0"
unity = "4.17.0.0"

[libraries]
# Kotlin
androidx-annotation-experimental = { module = "androidx.annotation:annotation-experimental", version.ref = "annotation-experimental" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso-core" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment-ktx" }
androidx-junit-v121 = { module = "androidx.test.ext:junit", version.ref = "junit-version" }
androidx-lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version.ref = "lifecycle-extensions" }
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle-livedata-ktx" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference-ktx" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
facebook = { module = "com.google.ads.mediation:facebook", version.ref = "facebook" }
firebase-analytics-ktx = { module = "com.google.firebase:firebase-analytics-ktx" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-perf-ktx = { module = "com.google.firebase:firebase-perf-ktx" }
firebase-crashlytics-ktx = { module = "com.google.firebase:firebase-crashlytics-ktx" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines-android" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# AndroidX
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity-compose" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidx-activity-ktx" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "androidx-compose" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "androidx-material3" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation", version.ref = "androidx-compose" }
androidx-compose-icons = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "androidx-compose" }

# AndroidX Lifecycle
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }

# Networking
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
ktor-client-serialization = { group = "io.ktor", name = "ktor-client-serialization", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }

# DI
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }

# Database
material = { module = "com.google.android.material:material", version.ref = "material" }
play-services-ads = { module = "com.google.android.gms:play-services-ads", version.ref = "play-services-ads" }
realm-kotlin = { group = "io.realm.kotlin", name = "library-base", version.ref = "realm" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotest-runner = { group = "io.kotest", name = "kotest-runner-junit4", version.ref = "kotest" }
kotest-assertions = { group = "io.kotest", name = "kotest-assertions-core", version.ref = "kotest" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

# Gradle Plugins
gradle-android = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
gradle-kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-serialization = { group = "org.jetbrains.kotlin", name = "kotlin-serialization", version.ref = "kotlin" }
unity = { module = "com.google.ads.mediation:unity", version.ref = "unity" }

[plugins]
# Kotlin & Gradle
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

# Custom Convention Plugins
rosary-kotlin-multiplatform = { id = "rosary.kotlin.multiplatform" }
rosary-kotlin-android = { id = "rosary.kotlin.android" }
rosary-android-application = { id = "rosary.android.application" }
rosary-android-library = { id = "rosary.android.library" }

[bundles]
ktor-client = ["ktor-client-core", "ktor-client-serialization", "ktor-client-logging"]
